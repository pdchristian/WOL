{
  "name": "WolManager",
  "info": {
    "author": "WOL Manager",
    "description": "Wake-on-LAN Manager (iOS, WKWebView-Wrapper)"
  },
  "settings": {
    "generateMultipleXcodeproj": false,
    "defaultConfig": "Release"
  },
  "options": {
    "bundleIdPrefix": "de",
    "deploymentTarget": { "iOS": "16.0" },
    "createIntermediateGroups": true,
    "postGenCommand": "echo 'XcodeGen fertig: ios/WolManager.xcodeproj erzeugen mit: xcodegen generate'"
  },
  "targets": {
    "WolManager": {
      "type": "application",
      "platform": "iOS",
      "sources": [
        "WolManager",
        { "path": "WebApp", "type": "folder" }
      ],
      # Watch-App ins iPhone-Bundle einbetten (Embed Watch Content) — ohne sie
      # listet die Watch-App auf dem iPhone keine companion App.
      "dependencies": [
        { "target": "WolManagerWatch" }
      ],
      "configFiles": [],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "de.wolmanager",
          "PRODUCT_NAME": "WolManager",
          "MARKETING_VERSION": "2.3.5",
          "CURRENT_PROJECT_VERSION": "1",
          "INFOPLIST_FILE": "WolManager/Info.plist",
          "IPHONEOS_DEPLOYMENT_TARGET": "16.0",
          "SWIFT_VERSION": "5.9",
          "TARGETED_DEVICE_FAMILY": "1",
          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
          "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME": "AccentColor",
          "CODE_SIGN_STYLE": "Automatic",
          "DEVELOPMENT_TEAM": "",
          "ENABLE_PREVIEWS": "YES",
          "LD_RUNPATH_SEARCH_PATHS": "$(inherited) @executable_path/Frameworks"
        },
        "configs": {
          "Debug": {
            "CODE_SIGN_IDENTITY": "Apple Development",
            "DEBUG_INFORMATION_FORMAT": "dwarf"
          },
          "Release": {
            "CODE_SIGN_IDENTITY": "Apple Distribution",
            "DEBUG_INFORMATION_FORMAT": "dwarf-with-dsym"
          }
        }
      },
      "info": {
        "path": "WolManager/Info.plist",
        "properties": {
          "CFBundleDisplayName": "Wake-on-LAN",
          "CFBundleShortVersionString": "$(MARKETING_VERSION)",
          "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)",
          "CFBundleLocalizations": ["de", "en", "fr", "es"],
          "LSRequiresIPhoneOS": true,
          "UILaunchScreen": { "UIColorName": "LaunchBackground" },
          "UISupportedInterfaceOrientations": ["UIInterfaceOrientationPortrait"],
          "UIUserInterfaceStyle": "Automatic",
          "UIApplicationSceneManifest": { "UIApplicationSupportsMultipleScenes": false },
          "NSLocalNetworkUsageDescription": "Wake-on-LAN Manager sendet Magic-Pakete und spricht den WOL Host Service in Ihrem lokalen Netzwerk an, um Geräte zu wecken, abzuschalten und ihren Status anzuzeigen.",
          "BGTaskSchedulerPermittedIdentifiers": ["de.wolmanager.schedule-refresh"],
          "LSApplicationQueriesSchemes": ["ms-rd", "rdp"],
          "NSAppTransportSecurity": { "NSAllowsLocalNetworking": true },
          "ITSAppUsesNonExemptEncryption": false
        }
      }
    },
    "WolManagerTests": {
      "type": "bundle.unit-test",
      "platform": "iOS",
      "sources": [
        "WolManagerTests"
      ],
      "dependencies": [
        { "target": "WolManager" }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "de.wolmanager.tests",
          "PRODUCT_NAME": "WolManagerTests",
          "SWIFT_VERSION": "5.9",
          "IPHONEOS_DEPLOYMENT_TARGET": "16.0",
          "GENERATE_INFOPLIST_FILE": "YES"
        }
      }
    },
    # Apple-Watch-App (watchOS 10+, SwiftUI). Läuft NUR auf der Watch und
    # kommuniziert via WCSession mit WatchBridgeService auf dem iPhone.
    # ACHTUNG: type "application.watchapp2" triggert einen XcodeGen-Bug
    # (CopyAndPreserveArchs-Konflikt, fehlende Build Rules — yonaskolb/XcodeGen#1257).
    # "application" + Dependency vom iOS-Target erzeugt denselben "Embed Watch
    # Content"-Phase (Watch/ im iPhone-Bundle) — nur so listet die Watch-App auf
    # dem iPhone die Companion-App.
    "WolManagerWatch": {
      "type": "application",
      "platform": "watchOS",
      "sources": [
        "WolManagerWatch"
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "de.wolmanager.watch",
          "PRODUCT_NAME": "WolManagerWatch",
          "MARKETING_VERSION": "2.3.5",
          "CURRENT_PROJECT_VERSION": "1",
          "WATCHOS_DEPLOYMENT_TARGET": "10.0",
          "SWIFT_VERSION": "5.9",
          "TARGETED_DEVICE_FAMILY": "4",
          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
          "CODE_SIGN_STYLE": "Automatic",
          "DEVELOPMENT_TEAM": "",
          "ENABLE_PREVIEWS": "YES",
          "GENERATE_INFOPLIST_FILE": "YES",
          "INFOPLIST_KEY_CFBundleDisplayName": "Wake-on-LAN",
          "INFOPLIST_KEY_WKCompanionAppBundleIdentifier": "de.wolmanager",
          "INFOPLIST_KEY_WKWatchOnly": false
        }
      }
    }
  },
  "schemes": {
    "WolManager": {
      "build": {
        "targets": {
          "WolManager": "all",
          "WolManagerTests": ["test"]
        }
      },
      "run": {
        "config": "Debug"
      },
      "test": {
        "config": "Debug",
        "targets": ["WolManagerTests"]
      }
    },
    "WolManagerWatch": {
      "build": {
        "targets": {
          "WolManagerWatch": "all"
        }
      },
      "run": {
        "config": "Debug"
      }
    }
  }
}
