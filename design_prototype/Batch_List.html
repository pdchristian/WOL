<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOL Android — Batch-Liste (Drag &amp; Drop) Prototyp</title>
<style>
/* ═══ Tokens — identisch zu android_html app.css (2.3.4) ════════════════ */
:root{
    --bg:#0f1115; --surface:#1a1d24; --surface-hover:#232733; --border:#2c303a;
    --text:#e6e8ee; --text-dim:#9aa0ab; --accent:#00b8a9; --accent-dark:#006b63;
    --accent-text:#032019;
    --online:#22c55e; --offline:#ef4444; --unknown:#f59e0b; --danger:#e0485a;
    --svc:#f97316; --blue:#60a5fa;
    --gauge-cpu:#00b8a9; --gauge-ram:#60a5fa; --gauge-gpu:#a78bfa; --gauge-vram:#f59e0b;
    --console-bg:#12141a;
  }
  .phone[data-theme="light"]{
    --bg:#f3f4f7; --surface:#ffffff; --surface-hover:#eef0f4; --border:#d8dbe2;
    --text:#1b1e24; --text-dim:#5b6270; --accent:#009688; --accent-dark:#00695f;
    --accent-text:#ffffff;
    --online:#16a34a; --offline:#dc2626; --unknown:#d97706; --danger:#dc2637;
    --svc:#ea580c; --blue:#2563eb;
    --gauge-cpu:#009688; --gauge-ram:#2563eb; --gauge-gpu:#7c3aed; --gauge-vram:#d97706;
    --console-bg:#f7f8fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,sans-serif}
  body{background:#07090c;display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-height:100vh;padding:16px;gap:10px}
  .protoBar{display:flex;gap:8px;align-items:center;color:#9aa0ab;font-size:12px}
  .protoBar button{border:1px solid #2c303a;background:#1a1d24;color:#e6e8ee;border-radius:8px;
    padding:6px 10px;font-size:12px;cursor:pointer}
  .protoBar button:active{border-color:#00b8a9;color:#00b8a9}

/* ═══ Phone-Frame (nur Prototyp) ════════════════════════════════════════ */
  .phone{position:relative;width:392px;height:820px;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:26px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column}
  .statusbar{display:flex;justify-content:space-between;padding:10px 18px 4px;
    font-size:11px;color:var(--text-dim)}
  .screen{flex:1;overflow-y:auto;padding:8px 16px 24px;display:block}

/* ═══ Typografie / Buttons — wie app.css ════════════════════════════════ */
  .pageTitle{font-size:21px;font-weight:600}
  .pageSub{color:var(--text-dim);font-size:12px;margin-top:2px}
  .sectionHeading{font-size:14px;font-weight:600;color:var(--text-dim);margin:18px 0 8px}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .mono{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim)}
  .btn{border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;
    font-weight:600;background:var(--surface);color:var(--text);cursor:pointer;text-align:center}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--accent);color:var(--accent-text);border:none}
  .btn.primary:active{background:var(--accent-dark)}
  .btn.danger{background:rgba(224,72,90,.12);color:var(--danger);border-color:rgba(224,72,90,.4)}
  .btn.small{padding:7px 10px;font-size:12px;border-radius:9px}
  .spacer{flex:1}
  .pill{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--border)}
  .pillOnline{color:var(--online);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .sep{height:1px;background:var(--border)}
  .inp{border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);
    padding:9px 11px;font-size:13px}
  .field{margin-bottom:8px}
  .field .inp{width:100%}
  .code{width:100%;min-height:120px;background:var(--console-bg);color:var(--text);
    border:1px solid var(--border);border-radius:9px;padding:10px;font-family:Consolas,monospace;
    font-size:12px;resize:vertical}
  .console{background:var(--console-bg);border:1px solid var(--border);border-radius:14px;
    padding:10px 12px;font-family:Consolas,monospace;font-size:11.5px;min-height:70px;
    color:var(--text-dim)}
  .console .err{color:var(--danger)}
  .console .dim{opacity:.7;margin-top:4px}
  .togRow{display:flex;justify-content:space-between;align-items:center}
  .toggle{width:42px;height:24px;border-radius:99px;background:var(--border);position:relative;
    cursor:pointer;flex-shrink:0;transition:background .15s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
    border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on{background:var(--accent)}
  .toggle.on::after{left:21px}
  .hint{font-size:11px;color:var(--unknown)}

/* ═══ NEU: Batch-Bibliothek (Parität Desktop BatchListWidget) ═══════════ */
  .libHead{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .libHead .sectionHeading{margin:0;flex:1}
  /* Liste: NUR Titel, 44px-Zeilen — wie QListWidget#batchList::item */
  .batchList{position:relative}
  .batchRow{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;
    font-size:13.5px;cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;background:transparent;border-radius:0}
  .batchRow + .batchRow{border-top:1px solid var(--border)}
  .batchRow:active{background:var(--surface-hover)}
  .batchRow.sel{background:rgba(0,184,169,.14);color:var(--accent);font-weight:600}
  .batchRow.sel .grip{opacity:1;color:var(--accent)}
  .batchRow.hidden{display:none}
  /* Grip (6 Punkte) — Desktop zeigt ihn nur unter dem Cursor; mobil dauerhaft,
     schwach, damit Drag &amp; Drop als Geste erkennbar ist */
  .grip{width:16px;height:16px;flex-shrink:0;opacity:.4;color:var(--text-dim)}
  .batchRow.dragging{position:absolute;left:0;right:0;z-index:5;background:var(--surface-hover);
    border:1px solid var(--accent);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    height:44px;opacity:.96;cursor:grabbing}
  .dropLine{position:absolute;left:10px;right:10px;height:2px;background:var(--accent);
    border-radius:2px;z-index:6;pointer-events:none}
  .reorderHint{font-size:11px;color:var(--text-dim);padding:8px 12px;display:flex;
    align-items:center;gap:6px}
  .reorderHint svg{width:12px;height:12px;opacity:.6}
  /* Editor-Panel (öffnet sich bei Klick auf einen Titel) */
  .editor{padding:12px;animation:openUp .18s ease}
  @keyframes openUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="protoBar">
  <span>Prototyp: Batch-Liste mit Drag &amp; Drop (Android, Parität Desktop)</span>
  <button data-act="theme">Theme</button>
  <button data-act="lang">EN</button>
</div>

<div class="phone" data-theme="dark">
  <div class="statusbar"><span>09:41</span><span>WOL Manager</span><span>100%</span></div>
  <div class="screen" id="scr"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ═══ I18N — Keys analog app.js ═════════════════════════════════════════ */
const I18N = {
  de: {
    "dash.back":"‹ Geräte","batch.title":"Batches","batch.new":"Neu","batch.dup":"Duplizieren",
    "batch.del":"Löschen","batch.run":"Ausführen","batch.save":"Speichern","batch.clear":"Leeren",
    "batch.out":"Ausgabe","batch.timeout":"Timeout (s)","batch.allow":"Batches auf diesem Gerät erlauben",
    "batch.newname":"Neuer Batch","batch.running":"Batch läuft…","batch.exit":"Exit-Code: {c}",
    "batch.dur":"Dauer: {s} s","batch.empty":"Noch keine Batches. „Neu“ erstellt einen neuen Batch.",
    "batch.disabled":"Ausführung deaktiviert: „Batches erlauben“ aktivieren und den Host freigeben.",
    "batch.exit.short":"Exit-Code {c}","batch.save.first":"Bitte zuerst den Batch speichern.",
    "batch.reorder":"Zum Sortieren halten und ziehen","batch.close":"Zurück zur Liste",
    "dev.saved":"Gespeichert","batch.duplicate":"Duplizieren","status.online":"Online",
  },
  en: {
    "dash.back":"‹ Devices","batch.title":"Batches","batch.new":"New","batch.dup":"Duplicate",
    "batch.del":"Delete","batch.run":"Run","batch.save":"Save","batch.clear":"Clear",
    "batch.out":"Output","batch.timeout":"Timeout (s)","batch.allow":"Allow batches on this device",
    "batch.newname":"New batch","batch.running":"Batch running…","batch.exit":"Exit code: {c}",
    "batch.dur":"Duration: {s} s","batch.empty":"No batches yet. \"New\" creates a new batch.",
    "batch.disabled":"Execution disabled: enable \"Allow batches\" and release the host.",
    "batch.exit.short":"exit code {c}","batch.save.first":"Please save the batch first.",
    "batch.reorder":"Press and hold to reorder","batch.close":"Back to list",
    "dev.saved":"Saved","batch.duplicate":"Duplicate","status.online":"Online",
  },
  fr: {
    "dash.back":"‹ Appareils","batch.title":"Lots","batch.new":"Nouveau","batch.dup":"Dupliquer",
    "batch.del":"Supprimer","batch.run":"Exécuter","batch.save":"Enregistrer","batch.clear":"Vider",
    "batch.out":"Sortie","batch.timeout":"Timeout (s)","batch.allow":"Autoriser les lots sur cet appareil",
    "batch.newname":"Nouveau lot","batch.running":"Lot en cours…","batch.exit":"Code retour : {c}",
    "batch.dur":"Durée : {s} s","batch.empty":"Aucun lot. « Nouveau » crée un lot.",
    "batch.disabled":"Exécution désactivée : activez « Autoriser les lots » et libérez l'hôte.",
    "batch.exit.short":"code retour {c}","batch.save.first":"Veuillez d'abord enregistrer le lot.",
    "batch.reorder":"Maintenir pour réordonner","batch.close":"Retour à la liste",
    "dev.saved":"Enregistré","batch.duplicate":"Dupliquer","status.online":"En ligne",
  },
  es: {
    "dash.back":"‹ Dispositivos","batch.title":"Lotes","batch.new":"Nuevo","batch.dup":"Duplicar",
    "batch.del":"Eliminar","batch.run":"Ejecutar","batch.save":"Guardar","batch.clear":"Vaciar",
    "batch.out":"Salida","batch.timeout":"Tiempo máx. (s)","batch.allow":"Permitir lotes en este dispositivo",
    "batch.newname":"Nuevo lote","batch.running":"Lote en ejecución…","batch.exit":"Código de salida: {c}",
    "batch.dur":"Duración: {s} s","batch.empty":"No hay lotes. „Nuevo“ crea un lote.",
    "batch.disabled":"Ejecución desactivada: active „Permitir lotes“ y libere el host.",
    "batch.exit.short":"código de salida {c}","batch.save.first":"Guarde primero el lote.",
    "batch.reorder":"Mantener pulsado para reordenar","batch.close":"Volver a la lista",
    "dev.saved":"Guardado","batch.duplicate":"Duplicar","status.online":"En línea",
  },
};
let lang = "de";
const t = (k, p) => { let s = I18N[lang][k] ?? k;
  for (const [a, b] of Object.entries(p || {})) s = s.replaceAll("{" + a + "}", b); return s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ═══ State — Batch-Daten am Gerät, wie device.batches in app.js ════════ */
const device = {
  id: "d1", name: "Fractal", ip: "192.168.178.50", mac: "60:45:2E:11:22:33",
  status: "online", username: "cp", allow_batch: true,
  batches: [
    { id: "b1", name: "ollama serve", script: "@echo off\r\nollama serve", timeout: 120 },
    { id: "b2", name: "Backup NAS", script: "@echo off\r\nrobocopy D:\\Data \\\\nas\\backup /MIR", timeout: 600 },
    { id: "b3", name: "Updates", script: "winget upgrade --all -e", timeout: 900 },
    { id: "b4", name: "Dienste neu starten", script: "net stop wslservice & net start wslservice", timeout: 60 },
  ],
};
const state = { ui: { selBatch: null }, con: { lines: [], running: false, exit: null, dur: null } };
const by = id => device.batches.find(b => b.id === id);

/* ═══ Grip-Glyph (6 Punkte wie _grip_pixmap im Desktop) ═════════════════ */
const GRIP = `<svg class="grip" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
  <circle cx="5.04" cy="4.16" r="1.44"/><circle cx="10.96" cy="4.16" r="1.44"/>
  <circle cx="5.04" cy="8" r="1.44"/><circle cx="10.96" cy="8" r="1.44"/>
  <circle cx="5.04" cy="11.84" r="1.44"/><circle cx="10.96" cy="11.84" r="1.44"/></svg>`;

/* ═══ Render ════════════════════════════════════════════════════════════ */
function render() {
  const sb = state.ui.selBatch ? by(state.ui.selBatch) : null;
  const list = device.batches.length ? `
    <div class="panel">
      <div class="libHead">
        <span class="sectionHeading">${esc(t("batch.title"))}</span>
        <button class="btn small" data-act="batch-dup">${esc(t("batch.dup"))}</button>
        <button class="btn small" data-act="batch-new">${esc(t("batch.new"))}</button>
      </div>
      <div class="sep"></div>
      <div class="batchList" id="blist">
        ${device.batches.map(b => `
          <div class="batchRow ${state.ui.selBatch === b.id ? "sel" : ""}" data-id="${b.id}">
            ${GRIP}<span>${esc(b.name)}</span></div>`).join("")}
      </div>
      <div class="sep"></div>
      <div class="reorderHint">${GRIP}<span>${esc(t("batch.reorder"))}</span></div>
      <div class="toolbar" style="padding:8px 10px;margin:0">
        <span class="spacer"></span>
        <button class="btn small danger" data-act="batch-del">${esc(t("batch.del"))}</button>
      </div>
    </div>`
    : `<div class="pageSub">${esc(t("batch.empty"))}</div>`;

  const editor = sb ? `
    <div class="panel editor" style="margin-top:10px">
      <div class="field"><input class="inp" id="b-name" value="${esc(sb.name)}" placeholder="${esc(t("batch.newname"))}"></div>
      <textarea class="code" id="b-script" placeholder="@echo off">${esc(sb.script)}</textarea>
      <div class="toolbar" style="margin:10px 0 0;align-items:center">
        <span class="mono" style="font-size:11px">${esc(t("batch.timeout"))}</span>
        <input class="inp" id="b-timeout" type="number" min="5" max="3600" value="${sb.timeout}" style="width:76px;padding:6px 8px">
        <span class="spacer"></span>
        <button class="btn small" data-act="batch-close">${esc(t("batch.close"))}</button>
        <button class="btn small" data-act="batch-save">${esc(t("batch.save"))}</button>
        <button class="btn small primary" data-act="batch-run">${esc(t("batch.run"))}</button>
      </div>
      <div class="togRow" style="padding:10px 0 0"><div style="font-size:12px">${esc(t("batch.allow"))}</div>
        <div class="toggle ${device.allow_batch ? "on" : ""}" data-act="batch-allow"></div></div>
      ${!device.allow_batch ? `<div class="hint" style="margin-top:6px">${esc(t("batch.disabled"))}</div>` : ""}
    </div>
    <div class="sectionHeading" style="display:flex;justify-content:space-between;align-items:baseline">
      <span>${esc(t("batch.out"))}</span>
      <button class="btn small" data-act="con-clear">${esc(t("batch.clear"))}</button></div>
    <div class="console">${state.con.lines.map(l => `<div class="${/fehler|error/i.test(l) ? "err" : ""}">${esc(l)}</div>`).join("")}
      ${state.con.running ? `<div class="dim">${esc(t("batch.running"))}</div>` : ""}
      ${state.con.exit != null ? `<div class="dim">${esc(t("batch.exit", { c: state.con.exit }))} · ${esc(t("batch.dur", { s: state.con.dur }))}</div>` : ""}</div>`
    : "";

  document.getElementById("scr").innerHTML = `
    <div class="toolbar" style="align-items:center">
      <button class="btn small">${esc(t("dash.back"))}</button>
      <span class="spacer"></span>
      <span class="pill pillOnline">${esc(t("status.online"))}</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">
      <div class="pageTitle" style="font-size:19px">${esc(device.name)}</div></div>
    <div class="mono">${esc([device.ip, device.mac].filter(Boolean).join(" · "))}</div>
    ${list}${editor}`;
  bindDrag();
}

/* ═══ Drag &amp; Drop Sortierung (Pointer-Events: Maus + Touch) ═════════
   Wie Desktop: Listenreihenfolge == persistierte Reihenfolge (device.batches).
   Mobil: langes Drücken auf einer Zeile startet den Drag (versehentliches
   Öffnen wird so verhindert); Drop-Indikator = Akzentlinie. */
function bindDrag() {
  const list = document.getElementById("blist");
  if (!list) return;
  let row = null, startY = 0, curY = 0, target = -1, holdTimer = null,
      dragging = false, rowH = 44, line = null;

  const clear = () => {
    clearTimeout(holdTimer); holdTimer = null;
    if (dragging && row) { row.classList.remove("dragging"); row.style.transform = ""; }
    if (line) { line.remove(); line = null; }
    row = null; dragging = false; target = -1;
  };

  const computeTarget = y => {
    const rows = [...list.querySelectorAll(".batchRow:not(.hidden):not(.dragging)")];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return i;
    }
    return rows.length;
  };

  const begin = () => {
    dragging = true;
    rowH = row.getBoundingClientRect().height;
    row.classList.add("hidden");               // Lücke am Ursprung (wie Qt-InternalMove)
    const ghost = row.cloneNode(true);
    ghost.classList.remove("hidden"); ghost.classList.add("dragging");
    ghost.style.transform = `translateY(${curY - startY}px)`;
    list.appendChild(ghost);
    row = ghost;
    line = document.createElement("div");
    line.className = "dropLine";
    list.appendChild(line);
    if (navigator.vibrate) navigator.vibrate(15);
    position();
  };

  const position = () => {
    row.style.transform = `translateY(${curY - startY}px)`;
    const lr = list.getBoundingClientRect();
    const rows = [...list.querySelectorAll(".batchRow:not(.hidden):not(.dragging)")];
    target = computeTarget(curY);
    let lineY;
    if (target >= rows.length) {
      const last = rows[rows.length - 1];
      lineY = last ? last.getBoundingClientRect().bottom - lr.top : lr.height;
    } else {
      lineY = rows[target].getBoundingClientRect().top - lr.top;
    }
    line.style.top = lineY + "px";
  };

  list.addEventListener("pointerdown", e => {
    const r = e.target.closest(".batchRow");
    if (!r) return;
    row = r; startY = curY = e.clientY;
    try { list.setPointerCapture(e.pointerId); } catch (_) {}
    holdTimer = setTimeout(begin, 300);        // mobil: long-press startet Drag
    if (e.pointerType === "mouse") { clearTimeout(holdTimer); }
  });
  list.addEventListener("touchmove", e => { if (dragging) e.preventDefault(); }, { passive: false });
  list.addEventListener("pointermove", e => {
    if (!row) return;
    curY = e.clientY;
    if (!dragging) {
      if (Math.abs(curY - startY) > 8) { clearTimeout(holdTimer); begin(); }
      else return;
    }
    e.preventDefault();
    position();
  });
  const commit = () => {
    if (!row) { clear(); return; }
    if (!dragging) { clearTimeout(holdTimer); clear(); return; }
    const from = row.dataset.id;
    const order = device.batches.map(b => b.id).filter(id => id !== from);
    order.splice(Math.min(target, order.length), 0, from);
    device.batches = order.map(id => by(id));
    // In der echten App hier: persistBatches(d) → saveDeviceNative (Reihenfolge ist persistiert).
    window.__justDragged = true;
    setTimeout(() => { window.__justDragged = false; }, 0);
    clear();
    render();
    toast(t("dev.saved"));
  };
  list.addEventListener("pointerup", commit);
  list.addEventListener("pointercancel", clear);
}

/* ═══ Aktionen ══════════════════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}
document.addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  switch (act) {
    case "theme": { const p = document.querySelector(".phone");
      p.dataset.theme = p.dataset.theme === "dark" ? "light" : "dark"; break; }
    case "lang": lang = lang === "de" ? "en" : lang === "en" ? "fr" : lang === "fr" ? "es" : "de";
      e.target.textContent = lang.toUpperCase(); render(); break;
    case "batch-new": { const b = { id: "b" + Date.now(), name: t("batch.newname"), script: "@echo off", timeout: 120 };
      device.batches.push(b); state.ui.selBatch = b.id; render(); break; }
    case "batch-dup": { const src = state.ui.selBatch && by(state.ui.selBatch);
      if (!src) { toast(t("batch.save.first"), true); break; }
      const c = { ...src, id: "b" + Date.now(), name: src.name + " (Kopie)" };
      device.batches.push(c); state.ui.selBatch = c.id; render(); break; }
    case "batch-del": if (state.ui.selBatch) {
        device.batches = device.batches.filter(b => b.id !== state.ui.selBatch);
        state.ui.selBatch = null; render(); } break;
    case "batch-save": { const b = state.ui.selBatch && by(state.ui.selBatch); if (!b) break;
      b.name = document.getElementById("b-name").value;
      b.script = document.getElementById("b-script").value;
      b.timeout = +document.getElementById("b-timeout").value || b.timeout;
      render(); toast(t("dev.saved")); break; }
    case "batch-close": state.ui.selBatch = null; render(); break;
    case "batch-run": { const b = state.ui.selBatch && by(state.ui.selBatch); if (!b) break;
      if (!device.allow_batch) { toast(t("batch.disabled")); break; }
      state.con = { lines: ["> " + b.script.split("\r\n")[0]], running: true, exit: null, dur: null };
      render();
      setTimeout(() => { state.con.running = false; state.con.exit = 0; state.con.dur = 1.4;
        state.con.lines.push("done"); render(); }, 900); break; }
    case "batch-allow": device.allow_batch = !device.allow_batch; render(); break;
    case "con-clear": state.con = { lines: [], running: false, exit: null, dur: null }; render(); break;
  }
});
/* Klick auf einen Titel öffnet den Batch (Editor) — Klick != Drag:
   ein Drag wird erst nach long-press (Touch) bzw. Bewegung >8px (Maus) aktiv;
   nach einem Drag unterdrückt __justDragged das nachfolgende click. */
document.addEventListener("click", e => {
  const r = e.target.closest(".batchRow");
  if (r && !window.__justDragged) { state.ui.selBatch = r.dataset.id; render(); }
});
render();
</script>
</body>
</html>
