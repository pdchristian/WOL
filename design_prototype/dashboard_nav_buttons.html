<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOL – Prototyp: Prev/Next im Gerätedashboard</title>
<style>
  :root {
    --bg:#0f1115; --surface:#1a1d24; --surface-hover:#232733; --border:#2c303a;
    --text:#e6e8ee; --text-dim:#9aa0ab; --accent:#00b8a9;
    --online:#22c55e; --offline:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,sans-serif}
  body{background:#090a0d;color:var(--text);padding:24px;display:flex;flex-direction:column;gap:28px;align-items:center}
  h2{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .demo{display:flex;align-items:center;gap:14px;background:rgba(0,184,169,.06);
    border:1px dashed rgba(0,184,169,.4);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--text-dim)}
  .demo label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)}
  .demo input{accent-color:var(--accent);width:15px;height:15px}

  /* ── Gemeinsame Bausteine (an App-Styles angelehnt) ── */
  .btn{border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;
    cursor:pointer;background:var(--surface);color:var(--text-dim);transition:.15s}
  .btn:hover:not(:disabled){background:var(--surface-hover);color:var(--text)}
  .btn:disabled{opacity:.4;cursor:default}
  .navArrow{width:34px;padding:8px 0;text-align:center;font-size:15px;line-height:1}
  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;flex-shrink:0}
  .pill.online{background:rgba(34,197,94,.15);color:var(--online)}
  .pill.offline{background:rgba(239,68,68,.15);color:var(--offline)}
  .pill.dashPos{background:var(--surface-hover);color:var(--text-dim);font-family:Consolas,monospace}
  .row{display:flex;align-items:center;gap:8px}

  /* ── Desktop-Frame ── */
  .desktop{width:780px;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:20px 24px}
  .desktop .header{display:flex;align-items:center;gap:12px}
  .desktop .titleblock{flex:1;min-width:0}
  .desktop .titlerow{display:flex;align-items:center;gap:10px}
  .desktop .title{font-size:19px;font-weight:700}
  .desktop .mono{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim);margin-top:3px}
  .desktop .interval{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim)}
  .desktop select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 8px}

  /* ── Mobile-Frame ── */
  .phone{width:390px;background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:18px 16px}
  .phone .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .phone .btn.small{padding:7px 10px;font-size:12px;border-radius:10px}
  .phone .navArrow{width:32px;padding:7px 0;font-size:14px}
  .phone .spacer{flex:1}
  .phone .titlerow{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .phone .title{font-size:19px;font-weight:700}
  .phone .mono{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim)}
  .phone .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .phone .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
  .phone .card .k{font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase}
  .phone .card .v{font-size:22px;font-weight:700;margin-top:8px}
</style>
</head>
<body>

<div class="demo">
  <span><b>Prototyp</b> – so umgesetzt (Desktop + iOS + Android)</span>
  <label><input type="checkbox" id="oneDevice"> Nur 1 Gerät (blendet ‹/› + 1/n aus)</label>
  <label><input type="checkbox" id="nasOffline" checked> „nas“ offline (wird beim Wechseln übersprungen)</label>
  <span>Gerät: <b id="dbg">1 / 3</b></span>
</div>

<h2>Windows & Ubuntu (Desktop)</h2>
<div class="desktop">
  <div class="header">
    <button class="btn" data-go="back">← Geräte</button>
    <button class="btn navArrow" data-go="prev" title="Vorheriges Gerät">‹</button>
    <button class="btn navArrow" data-go="next" title="Nächstes Gerät">›</button>
    <div class="titleblock">
      <div class="titlerow">
        <span class="title" id="d-name">a4-tv</span>
        <span class="pill dashPos" id="d-pos">1/3</span>
        <span class="pill online" id="d-badge">Online</span>
      </div>
      <div class="mono" id="d-mono">192.168.2.111 · Host Service v4</div>
    </div>
    <span class="interval">Intervall</span>
    <select><option>3 s</option><option>5 s</option></select>
  </div>
</div>

<h2>iOS & Android (mobil)</h2>
<div class="phone">
  <div class="toolbar">
    <button class="btn small" data-go="back">‹ Geräte</button>
    <button class="btn small navArrow" data-go="prev" title="Vorheriges Gerät">‹</button>
    <button class="btn small navArrow" data-go="next" title="Nächstes Gerät">›</button>
    <span class="spacer"></span>
    <span class="mono" style="font-size:11px;color:var(--text-dim)">Intervall</span>
    <select style="background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:4px 6px"><option>3 s</option></select>
  </div>
  <div class="titlerow">
    <span class="title" id="m-name">a4-tv</span>
    <span class="pill dashPos" id="m-pos">1/3</span>
    <span class="pill online" id="m-badge">Online</span>
  </div>
  <div class="mono" id="m-mono">192.168.2.111 · Host Service v4</div>
  <div class="cards">
    <div class="card"><div class="k">CPU-Auslastung</div><div class="v" id="c0">2%</div></div>
    <div class="card"><div class="k">RAM-Nutzung</div><div class="v" id="c1">12%</div></div>
  </div>
</div>

<script>
  const devices = [
    { name: "a4-tv",      ip: "192.168.2.111", on: true,  cpu: "2%",  ram: "12%" },
    { name: "workstation",ip: "192.168.2.50",  on: true,  cpu: "37%", ram: "58%" },
    { name: "nas",        ip: "192.168.2.9",   on: false, cpu: "0%",  ram: "0%"  },
  ];
  let idx = 0;

  function render() {
    const all = document.getElementById("oneDevice").checked ? devices.slice(0, 1) : devices;
    devices[2].on = !document.getElementById("nasOffline").checked;
    // Nav-Sequenz: offline Geräte werden übersprungen, das aktuelle bleibt drin
    const list = all.filter(d => d.name === devices[idx].name || d.on);
    if (!list.some(d => d.name === devices[idx].name)) idx = 0;
    const d = devices[idx], many = list.length > 1;
    const li = list.findIndex(x => x.name === d.name);
    for (const p of ["d", "m"]) {
      document.getElementById(p + "-name").textContent = d.name;
      document.getElementById(p + "-mono").textContent = d.ip + " · Host Service v4";
      const b = document.getElementById(p + "-badge");
      b.textContent = d.on ? "Online" : "Offline";
      b.className = "pill " + (d.on ? "online" : "offline");
      const pos = document.getElementById(p + "-pos");
      pos.style.display = many ? "" : "none";
      pos.textContent = (li + 1) + "/" + list.length;
    }
    document.getElementById("c0").textContent = d.cpu;
    document.getElementById("c1").textContent = d.ram;
    document.getElementById("dbg").textContent = (li + 1) + " / " + list.length;
    // Buttons: sichtbar nur bei >1 Gerät; inaktiv am ersten/letzten erreichbaren Gerät
    document.querySelectorAll('[data-go="prev"]').forEach(b => { b.style.display = many ? "" : "none"; b.disabled = li === 0; });
    document.querySelectorAll('[data-go="next"]').forEach(b => { b.style.display = many ? "" : "none"; b.disabled = li === list.length - 1; });
  }
  function step(dir) {
    const all = document.getElementById("oneDevice").checked ? devices.slice(0, 1) : devices;
    const list = all.filter(d => d.name === devices[idx].name || d.on);
    const li = list.findIndex(x => x.name === devices[idx].name);
    const nl = li + dir;
    if (nl < 0 || nl >= list.length) return;
    idx = devices.findIndex(d => d.name === list[nl].name);
    render();
  }
  document.querySelectorAll('[data-go="prev"]').forEach(b => b.onclick = () => step(-1));
  document.querySelectorAll('[data-go="next"]').forEach(b => b.onclick = () => step(1));
  document.getElementById("oneDevice").onchange = () => { idx = 0; render(); };
  document.getElementById("nasOffline").onchange = render;
  render();
</script>
</body>
</html>
