<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOL Manager Android v5 – Interaktiver Prototyp</title>
<!--
  ============================================================================
  WOL Manager Android v5 – INTERAKTIVER Prototyp (Simulation, kein Build nötig)
  ----------------------------------------------------------------------------
  • Navigation (5 Tabs): Geräte · Verwalten · Zeitplan · Protokolle · Einstellungen
    → spiegelt die Windows-Modern-UI-Sidebar (modern_main_window.py, NAV_DEFS)
  • Alle Inhalte inhaltlich identisch zur Windows-Version (modern_theme.py
    Farbtokens DARK/LIGHT, originale de.json-Strings, Panels/Kacheln/Zeilen),
    adaptiert an mobile Dimensionen (Bottom-Sheets statt Dialoge, Long-Press
    statt Rechtsklick, 1-Spalter-Formulare)
  • „Info" (Über + Update-Prüfung) hängt unten an den Einstellungen
  • „Beenden" gibt es unter Android nicht (entfällt)
  • Geräte-Dashboard wie Windows: 📊-Kachel öffnet Screen mit ← Geräte-Back,
    Dienste, 4 Metrik-Ringen, Batches + Konsole
  Öffnen: direkt im Browser (F12 → Handy-Emulation empfohlen).
  ============================================================================
-->
<style>
  :root{
    --bg:#0f1115; --surface:#1a1d24; --surface-hover:#232733; --border:#2c303a;
    --text:#e6e8ee; --text-dim:#9aa0ab; --accent:#00b8a9; --accent-dark:#006b63;
    --accent-text:#032019;
    --online:#22c55e; --offline:#ef4444; --unknown:#f59e0b; --danger:#e0485a;
    --svc:#f97316; --blue:#60a5fa;
    --gauge-cpu:#00b8a9; --gauge-ram:#60a5fa; --gauge-gpu:#a78bfa; --gauge-vram:#f59e0b;
    --console-bg:#12141a;
  }
  .phone[data-theme="light"]{
    --bg:#f3f4f7; --surface:#ffffff; --surface-hover:#eef0f4; --border:#d8dbe2;
    --text:#1b1e24; --text-dim:#5b6270; --accent:#009688; --accent-dark:#00695f;
    --accent-text:#ffffff;
    --online:#16a34a; --offline:#dc2626; --unknown:#d97706; --danger:#dc2637;
    --svc:#ea580c; --blue:#2563eb;
    --gauge-cpu:#009688; --gauge-ram:#2563eb; --gauge-gpu:#7c3aed; --gauge-vram:#d97706;
    --console-bg:#f7f8fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,sans-serif}
  body{background:#000;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:16px;overflow:auto}
  .phone{position:relative;width:392px;height:820px;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;overflow:hidden;border:2px solid #333;border-radius:36px}
  .statusbar{display:flex;justify-content:space-between;padding:10px 22px 4px;
    font-size:12px;color:var(--text-dim)}
  .screen{flex:1;overflow-y:auto;padding:14px 16px 92px;display:none;animation:fade .18s}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  /* ── Typografie wie modern_theme.py (pageTitle 21/600, subtitle 12 dim) ── */
  .pageTitle{font-size:21px;font-weight:600}
  .pageSub{color:var(--text-dim);font-size:12px;margin-top:2px}
  .sectionHeading{font-size:14px;font-weight:600;color:var(--text-dim);margin:18px 0 8px}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .mono{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim)}
  /* ── Buttons (Windows: radius 9, primary=accent) ─────────────────────── */
  .btn{border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;
    font-weight:600;background:var(--surface);color:var(--text);cursor:pointer;text-align:center}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--accent);color:var(--accent-text);border:none}
  .btn.primary:active{background:var(--accent-dark)}
  .btn.danger{background:rgba(224,72,90,.12);color:var(--danger);border-color:rgba(224,72,90,.4)}
  .btn.small{padding:7px 10px;font-size:12px;border-radius:9px}
  .iconBtn{width:36px;height:36px;flex-shrink:0;border:1px solid var(--border);border-radius:9px;
    background:var(--surface);color:var(--text);font-size:15px;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center}
  .iconBtn:active{border-color:var(--accent);color:var(--accent)}
  .spacer{flex:1}
  /* Action-Kacheln 36×36 wie #tileButton / #tileDanger */
  .tileBtn{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface);font-size:15px;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .tileBtn:active{background:var(--accent);border-color:var(--accent)}
  .tileDanger:active{background:var(--danger);border-color:var(--danger)}
  /* wake/shutdown outline buttons wie Windows-Kachel */
  .wakeBtn{width:100%;border:1px solid var(--accent);color:var(--accent);background:transparent;
    border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer}
  .wakeBtn:active{background:var(--accent);color:var(--accent-text)}
  .shutdownBtn{width:100%;border:1px solid var(--danger);color:var(--danger);background:transparent;
    border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer}
  .shutdownBtn:active{background:var(--danger);color:#fff}
  /* ── Statuspunkte (10px, NUR Punkt wie Windows) ──────────────────────── */
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dotOnline{background:var(--online);box-shadow:0 0 8px var(--online)}
  .dotOffline{background:var(--offline)}
  .dotUnknown{background:var(--unknown)}
  .dotWaking{background:var(--unknown);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  /* ── Panels + Zeilen (Windows: radius 14, ROW 64px) ──────────────────── */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .row64{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px}
  .sep{height:1px;background:var(--border)}
  .rowTitle{font-size:14px;font-weight:600}
  .rowTitle.dis{color:var(--text-dim)}
  .rowInfo{flex:1;min-width:0}
  .rowInfo .mono{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .tiles{display:flex;gap:6px;align-items:center}
  /* ── Geräte-Kacheln (2 Spalten auf Mobil) ────────────────────────────── */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px;position:relative}
  .card.dis{opacity:.55}
  .card .dot{position:absolute;top:14px;right:14px}
  .card .name{font-size:14px;font-weight:600;padding-right:16px;word-break:break-word}
  .card .mono{display:block;margin-top:2px}
  .card .tiles{margin-top:12px}
  .card .wakeBtn,.card .shutdownBtn{margin-top:10px}
  /* ── Bottom-Nav: 5 Bereiche (Icons wie Windows-Sidebar) ──────────────── */
  .bottomnav{display:flex;background:var(--surface);border-top:1px solid var(--border);
    padding:8px 2px 18px;z-index:20}
  .nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;
    border:none;color:var(--text-dim);font-size:9px;cursor:pointer;padding:6px 0}
  .nav .i{font-size:19px}
  .nav.active{color:var(--accent);font-weight:700}
  /* ── Suche / Selects ─────────────────────────────────────────────────── */
  .search{display:flex;gap:8px;align-items:center;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:10px}
  .search input{background:none;border:none;outline:none;color:var(--text);flex:1;font-size:13px}
  select.sel{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:9px 10px;font-size:12px;outline:none}
  input.inp{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:10px 12px;font-size:13px;outline:none;width:100%}
  input.inp:focus,select.sel:focus{border-color:var(--accent)}
  /* ── Toggle-Switch (40×22, wie widgets/toggle_switch.py) ─────────────── */
  .toggle{width:40px;height:22px;border-radius:999px;background:var(--border);position:relative;
    cursor:pointer;flex-shrink:0;transition:background .15s}
  .toggle::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;top:3px;right:21px;transition:right .15s}
  .toggle.on{background:var(--accent)} .toggle.on::after{right:3px}
  .togRow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 14px;font-size:13.5px}
  /* ── Badges (Logs radius 6 / Status-Pill) ────────────────────────────── */
  .lvl{width:64px;height:18px;border-radius:6px;font-size:10px;font-weight:700;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center}
  .badgeInfo{background:rgba(59,130,246,.15);color:var(--blue)}
  .badgeWarn{background:rgba(245,158,11,.15);color:var(--unknown)}
  .badgeError{background:rgba(239,68,68,.15);color:var(--offline)}
  .pill{font-size:10px;font-weight:700;border-radius:999px;padding:3px 10px;flex-shrink:0}
  .pillOnline{background:rgba(34,197,94,.15);color:var(--online)}
  .pillOffline{background:rgba(239,68,68,.15);color:var(--offline)}
  .pillUnknown{background:rgba(245,158,11,.15);color:var(--unknown)}
  /* ── Einstellungen-Felder (label above, Windows #fieldLabel) ─────────── */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px}
  .field .hint{font-size:11px;color:var(--text-dim);margin-top:5px;line-height:1.4}
  .infoBlock{color:var(--text-dim);font-size:12px;line-height:1.55;padding:12px 14px;
    border:1px dashed var(--border);border-radius:10px;margin-top:14px}
  /* ── Protokoll-Zeile (48px, Badge/Zeit/Gerät/Nachricht) ──────────────── */
  .logrow{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px}
  .logrow .t{font-family:Consolas,monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;width:76px}
  .logrow .dv{font-size:11.5px;color:var(--text-dim);flex-shrink:0;max-width:80px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logrow .m{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ── Scan ─────────────────────────────────────────────────────────────── */
  .progress{height:6px;border-radius:8px;background:var(--surface-hover);overflow:hidden;margin:10px 0}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .badge{font-size:10px;border-radius:999px;padding:2px 8px;font-weight:700}
  .badge.new{background:rgba(0,184,169,.16);color:var(--accent)}
  .badge.known{background:var(--surface-hover);color:var(--text-dim)}
  .empty{text-align:center;color:var(--text-dim);padding:40px 10px;font-size:13px}
  /* ── Dashboard ───────────────────────────────────────────────────────── */
  .chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 10px;
    font-size:11px;font-weight:600;margin:3px 4px 3px 0}
  .chip.run{background:rgba(34,197,94,.14);color:var(--online)}
  .chip.probe{background:rgba(249,115,22,.14);color:var(--svc)}
  .chip.off{background:var(--surface-hover);color:var(--text-dim)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .metricCard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
  .metricCard .mt{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;
    letter-spacing:1px;color:var(--text-dim)}
  .metricCard .mt i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .gauge{--v:0;--c:var(--accent);width:84px;height:84px;border-radius:50%;margin:8px auto;
    background:conic-gradient(var(--c) calc(var(--v)*1%),var(--surface-hover) 0)}
  .gauge .in{width:66px;height:66px;border-radius:50%;background:var(--surface);margin:9px;
    display:flex;align-items:center;justify-content:center;flex-direction:column}
  .gauge b{font-size:17px}
  .mdet{font-size:10.5px;color:var(--text-dim);text-align:center;margin-top:2px}
  .console{background:var(--console-bg);border:1px solid var(--border);border-radius:10px;
    font-family:Consolas,monospace;font-size:11px;color:#8ef0c8;padding:10px;margin-top:8px;
    max-height:150px;overflow-y:auto;white-space:pre-wrap}
  .console .err{color:#ff8d8d} .console .dim{color:var(--text-dim)}
  textarea.code{width:100%;background:var(--console-bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;font-family:Consolas,monospace;font-size:12px;padding:10px;min-height:76px;
    outline:none;resize:vertical}
  .batchItem{padding:10px 12px;font-size:13px;cursor:pointer}
  .batchItem.sel{background:rgba(0,184,169,.14);color:var(--accent)}
  .warnbox{border-radius:12px;padding:12px;font-size:12.5px;margin:12px 0;line-height:1.45}
  .warnbox.warn{background:rgba(245,158,11,.12);color:var(--unknown);border:1px solid rgba(245,158,11,.4)}
  .warnbox.err{background:rgba(224,72,90,.12);color:var(--danger);border:1px solid rgba(224,72,90,.4)}
  /* ── Bottom-Sheet / Dialoge ──────────────────────────────────────────── */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
  .overlay.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
    border-radius:24px 24px 0 0;padding:18px 18px 26px;max-height:82%;overflow-y:auto;
    transform:translateY(105%);transition:transform .22s ease;z-index:50;border-top:1px solid var(--border)}
  .sheet.open{transform:translateY(0)}
  .sheet h2{font-size:17px;margin-bottom:14px}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
  .sheetbtns{display:flex;gap:10px;margin-top:16px}
  .menuitem{display:flex;align-items:center;gap:10px;padding:13px 4px;font-size:14px;cursor:pointer;
    border-bottom:1px solid var(--border)}
  .menuitem:last-of-type{border-bottom:none}
  .menuitem.dis{opacity:.4;pointer-events:none}
  .powerIcon{width:64px;height:64px;margin:6px auto 12px;border:4px solid var(--danger);
    border-radius:50%;border-top-color:transparent;position:relative;transform:rotate(-45deg)}
  .powerIcon::after{content:"";position:absolute;left:50%;top:-26px;width:4px;height:32px;
    background:var(--danger);transform:translateX(-50%)}
  /* ── Toast / Spinner ─────────────────────────────────────────────────── */
  .toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--surface-hover);
    color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.35);
    border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ── Info-Block (unten an Einstellungen) ─────────────────────────────── */
  .aboutBlock{text-align:center;padding:22px 10px 8px}
  .logoTile{width:84px;height:84px;border-radius:20px;margin:0 auto 12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--accent-text)}
  .aboutTitle{font-size:22px;font-weight:600}
  .aboutVer{color:var(--text-dim);font-size:12px;margin-top:3px}
  .aboutText{color:var(--text-dim);font-size:12.5px;line-height:1.55;margin:10px auto 14px;max-width:300px}
  .updStatus{font-size:12.5px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="phone" id="phone" data-theme="dark">
  <div class="statusbar"><span id="clock">09:41</span><span>📶 &nbsp;🔋 86 %</span></div>

  <div class="screen active" id="s-devices"></div>
  <div class="screen" id="s-manage"></div>
  <div class="screen" id="s-sched"></div>
  <div class="screen" id="s-logs"></div>
  <div class="screen" id="s-set"></div>
  <div class="screen" id="s-dash"></div>

  <!-- 5 Bereiche: wie Windows-Sidebar NAV_DEFS + Einstellungen; „Beenden" entfällt -->
  <div class="bottomnav">
    <button class="nav active" data-nav="devices"><span class="i">💻</span><span data-t="nav.devices">Geräte</span></button>
    <button class="nav" data-nav="manage"><span class="i">🔧</span><span data-t="nav.manage">Verwalten</span></button>
    <button class="nav" data-nav="sched"><span class="i">🕒</span><span data-t="nav.schedule">Zeitplan</span></button>
    <button class="nav" data-nav="logs"><span class="i">📋</span><span data-t="nav.logs">Protokolle</span></button>
    <button class="nav" data-nav="set"><span class="i">⚙️</span><span data-t="nav.settings">Einstellungen</span></button>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ══════════════════════════ i18n — Strings = de.json der Windows-App ═════ */
const I18N = {

/* ══════════════════════════ Helpers ═══════════════════════════════════════ */
const $ = s => document.querySelector(s);
const t = (k, vars) => {
  let s = (I18N[state.lang] && I18N[state.lang][k]) ?? I18N.de[k] ?? k;
  for (const [v, r] of Object.entries(vars || {})) s = s.replaceAll("{"+v+"}", r);
  return s;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escA = s => esc(s).replaceAll("\n","<br>");
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const byId = id => state.devices.find(d => d.id === id);
const DAY_CODES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const RE_MAC = /^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$/;
const RE_HOST = /^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))*$/;
const RE_IP = /^(\d{1,3}\.){3}\d{1,3}$/;
const dotCls = d => d.status === "online" ? "dotOnline" : d.status === "offline" ? "dotOffline"
  : d.status === "waking" ? "dotWaking" : "dotUnknown";
const statusName = d => t("status." + (d.status === "waking" ? "unknown" : d.status));
function fmtUptime(s) {
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d ? d+"d " : "") + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}
function daysText(days) {
  if (!days.length || days.length === 7) return t("sched.days.every");
  if (days.length === 5 && DAY_CODES.slice(0,5).every(d => days.includes(d))) return t("sched.days.weekdays");
  return DAY_CODES.filter(d => days.includes(d)).map(d => t("day."+d)).join(" · ");
}
function logIt(device, level, msg) {
  state.logs.unshift({ ts: Date.now(), device, level, msg });
  if (state.logs.length > 300) state.logs.pop();
  if (state.ui.screen === "logs") renderLogs();
}
function toast(msg, isErr) {
  const el = $("#toast"); el.textContent = msg;
  el.classList.toggle("err", !!isErr); el.classList.add("show");
  clearTimeout(el._tm); el._tm = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ══════════════════════════ Aktionen: Wake / Shutdown / Ping ══════════════ */
function wakeDevice(d) {
  if (d.status === "online" || d.status === "waking" || !d.enabled) return;
  d.status = "waking"; renderDevices();
  setTimeout(() => {
    d.status = "online"; d.upSeconds = 45; d.metrics = null;
    logIt(d.name, "info", t("wol.online", {}));
    toast(t("wol.online", { name: d.name }));
    renderDevices(); if (state.ui.screen === "dash") renderDash();
  }, rnd(3500, 6000));
  logIt(d.name, "info", "Magic Packet (Port " + state.settings.broadcastPort + ") gesendet");
  toast(t("wol.sent", { name: d.name }));
}
function shutdownDevice(d) {
  logIt(d.name, "info", "Host Service: Shutdown ausgeführt");
  toast(t("devices.shutdown") + ": " + d.name + " …");
  setTimeout(() => { d.status = "offline"; d.metrics = null;
    renderDevices(); if (state.ui.screen === "dash") renderDash(); }, 2500);
}
function refreshStatus() {
  renderDevices(); renderManage();
}
setInterval(() => { if (state.ui.screen === "devices") refreshStatus(); }, 30000);

function pingDevice(d) {
  if (d.status === "online") toast(t("ping.ok", { ip: d.ip, ms: Math.round(rnd(1, 9)) }));
  else toast(t("ping.fail", { ip: d.ip }), true);
}

const SCAN_POOL = [
  { ip:"192.168.2.1",   mac:"AA:BB:CC:00:11:22", host:"fritz.box" },
  { ip:"192.168.2.33",  mac:"DC:A6:32:9F:11:0A", host:"nas01.lan" },
  { ip:"192.168.2.50",  mac:"60:CF:84:84:31:29", host:"a4-h20" },

  { ip:"192.168.2.111", mac:"A0:AD:9F:1C:09:FF", host:"a4-tv" },

function startScan() {
  if (!state.scan.ifaces.some(i => i.checked)) { openAlert(t("manage.scan.none"), t("manage.scan.none.msg")); return; }
  state.scan.running = true; state.scan.results = []; state.scan.shown = false;
  renderManage();
  let p = 0;
  const tm = setInterval(() => {
    p = Math.min(100, p + rnd(9, 22));
    const bar = $("#scanProg"); if (bar) bar.style.width = p + "%";
    if (p >= 100) {
      clearInterval(tm);
      const knownMacs = new Set(state.devices.map(d => d.mac.toUpperCase()));
      state.scan.running = false; state.scan.shown = true;
      state.scan.results = SCAN_POOL.map(r => ({ ...r, known: knownMacs.has(r.mac) }));
      logIt("—", "info", t("manage.scan.done", { count: state.scan.results.length }));
      renderManage();
    }
  }, 180);
}
function scanAdd(host, ip, mac) {
  if (state.devices.some(d => d.mac.toUpperCase() === mac.toUpperCase())) {
    openAlert(t("mac.dup.title"), t("mac.dup.msg", { mac })); return;
  }
  if (!mac || mac === "—") {
    openConfirm(t("mac.unknown.title"), t("mac.unknown.msg", { host: host || ip, ip }), () => {
      closeSheet(); openDeviceSheet(null, { name: host === "Unknown" ? "" : (host || ip), ip, mac: "00:00:00:00:00:00" });
    });
    return;
  }
  openDeviceSheet(null, { name: (!host || host === "Unknown") ? "" : host, ip, mac });
}

/* ══════════════════════════ Dashboard-Metriken (2 s-Tick wie Windows) ═════ */
function walk(prev, min, max, vol) {
  if (prev == null) return clamp(rnd(min, max), min, max);
  return clamp(prev + rnd(-vol, vol), min, max);
}
function seedMetrics(d) {
  d.metrics = { cpu: Math.round(walk(null,15,70,0)), ram: Math.round(walk(null,30,75,0)),
    gpu: Math.round(walk(null,5,90,0)), vram: Math.round(walk(null,10,80,0)),
    cores: 16, ramTotal: 64, models: ["Qwen3.8-Flash-256k-62","DeepSeek-R1-Distill-32B"] };
  d.spark = { cpu:[], ram:[], gpu:[] };
}
function tickMetrics() {
  const d = byId(state.ui.dashDeviceId);
  if (!d || d.status !== "online" || !d.username || !d.sim.reachable) return;
  if (!d.metrics) seedMetrics(d);
  const m = d.metrics;
  m.cpu = Math.round(walk(m.cpu, 2, 98, 9)); m.ram = Math.round(walk(m.ram, 20, 95, 3));
  m.gpu = Math.round(walk(m.gpu, 0, 99, 14)); m.vram = Math.round(walk(m.vram, 5, 96, 6));
  d.upSeconds += state.ui.dashInterval / 1000;
  for (const k of ["cpu","ram","gpu"]) { d.spark[k].push(m[k]); if (d.spark[k].length > 60) d.spark[k].shift(); }
  if (m.gpu >= 60) d.gpuHigh++; else d.gpuHigh = 0;
  if (state.ui.screen === "dash") updateDashLive(d);
}
let dashTimer = null;
function restartDashTimer() {
  clearInterval(dashTimer);
  dashTimer = setInterval(tickMetrics, state.ui.dashInterval);
}
restartDashTimer();

function updateDashLive(d) {
  const m = d.metrics; if (!m) return;
  for (const k of ["cpu","ram","gpu","vram"]) {
    const g = document.querySelector(`[data-g="${k}"]`); if (!g) return;
    g.style.setProperty("--v", m[k]);
    const b = document.querySelector(`[data-gv="${k}"]`); if (b) b.textContent = m[k] + "%";
  }
  for (const k of ["cpu","ram","gpu"]) {
    const sp = document.querySelector(`[data-spark="${k}"]`);
    if (sp) sp.innerHTML = sparkSvg(d.spark[k], `var(--gauge-${k})`);
  }
  const up = $("#dashUptime"); if (up) up.textContent = t("d.uptime", { v: fmtUptime(d.upSeconds) });
  const inf = $("#infBadge"); if (inf) inf.style.display = d.gpuHigh >= 2 ? "inline" : "none";
}
function sparkSvg(vals, color) {
  if (!vals || !vals.length) return `<svg width="100%" height="30" viewBox="0 0 140 30"></svg>`;
  const pts = vals.map((v, i) => `${((i / Math.max(1, vals.length - 1)) * 140).toFixed(1)},${(30 - (v / 100) * 28 - 1).toFixed(1)}`).join(" ");
  return `<svg width="100%" height="30" viewBox="0 0 140 30" preserveAspectRatio="none">
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/></svg>`;
}
function serviceState(d, entry) {
  if (d.status !== "online") return "off";
  return entry.includes(":") ? "run" : "probe";
}
function svcLine(d, entry) {
  const st = serviceState(d, entry);
  const pid = 1000 + (entry.length * 7) % 8000;
  const port = (entry.split(":")[1] || "8080");
  if (st === "off") return t("svc.gone");
  if (entry.toLowerCase().startsWith("backup")) return t("svc.running", { pid });
  return entry.includes(":") ? t("svc.ready", { pid, port }) : t("svc.running", { pid });
}

/* ══════════════════════════ Batches (Dashboard) ═══════════════════════════ */
const BATCH_OUT = {
  "nvidia-smi": ["$ nvidia-smi","| GPU  Name      Bus-Id  Vol Unc Corr |","|  0  RTX 4090   01:00.0    0    0 |","| Memory 18.2 / 24.0 GiB   GPU  64 % |"],
  "backup.bat": ["$ backup.bat","Sichere D:\\Dokumente …","Fehler: Datenträger nicht gefunden.","backup: exit 2"],
};
function currentBatches() { return state.batches.filter(b => b.devId === state.ui.dashDeviceId); }
function selBatchObj() { return state.batches.find(b => b.id === state.ui.selBatch); }
function runBatch() {
  const b = selBatchObj(); const d = byId(state.ui.dashDeviceId);
  if (!b || !d || state.con.running) return;
  if (!d.allow_batch) { toast(t("batch.disabled"), true); return; }
  state.con = { lines: ["$ " + b.script], running: true, exit: null, dur: null, timer: null };
  const out = BATCH_OUT[b.script] || ["OK"];
  let i = 0; const t0 = Date.now();
  const step = () => {
    if (!state.con.running) return;
    if (i < out.length) { state.con.lines.push(out[i++]); renderDash(); state.con.timer = setTimeout(step, rnd(250, 600)); }
    else {
      state.con.running = false;
      state.con.exit = /fehler|error/i.test(out.join(" ")) ? 2 : 0;
      state.con.dur = ((Date.now() - t0) / 1000).toFixed(1);
      logIt(d.name, state.con.exit === 0 ? "info" : "error", `${b.name} -> Exit-Code ${state.con.exit}`);
      renderDash();
    }
  };
  renderDash(); step();
}

        <option value="de" ${s.language==="de"?"selected":""}>Deutsch</option>
        <option value="en" ${s.language==="en"?"selected":""}>English</option>
        <option value="fr" ${s.language==="fr"?"selected":""}>Français</option>
        <option value="es" ${s.language==="es"?"selected":""}>Español</option></select></div>
    <div class="field"><label>${esc(t("set.display"))}</label>
      <select class="sel" id="st-disp" style="width:100%">
        <option value="auto" ${s.displayMode==="auto"?"selected":""}>${esc(t("disp.auto"))}</option>
        <option value="light" ${s.displayMode==="light"?"selected":""}>${esc(t("disp.light"))}</option>
        <option value="dark" ${s.displayMode==="dark"?"selected":""}>${esc(t("disp.dark"))}</option></select></div>
    <div class="field"><label>${esc(t("set.design"))}</label>
      <select class="sel" id="st-design" style="width:100%">
        <option value="classic" ${s.design==="classic"?"selected":""}>${esc(t("design.classic"))}</option>
        <option value="modern" ${s.design==="modern"?"selected":""}>${esc(t("design.modern"))}</option></select>
      <div class="hint">${esc(t("set.design.hint"))}</div></div>
    <div class="togRow" style="padding:6px 0"><div>${esc(t("set.auto_update"))}</div>
      <div class="toggle ${s.autoUpdate?"on":""}" data-act="set-toggle" data-key="autoUpdate"></div></div>
    <div class="field" style="margin-top:12px"><label>${esc(t("set.interval"))}</label>
      <select class="sel" id="st-int" style="width:100%">
        <option value="24" ${s.interval==="24"?"selected":""}>${esc(t("int.day"))}</option>
        <option value="168" ${s.interval==="168"?"selected":""}>${esc(t("int.week"))}</option>
        <option value="720" ${s.interval==="720"?"selected":""}>${esc(t("int.month"))}</option></select></div>
    <div class="field"><label>${esc(t("set.max_logs"))}</label>
      <input class="inp" id="st-maxlogs" type="number" min="10" max="10000" step="50" value="${s.maxLogs}"></div>
    <div class="field"><label>${esc(t("set.resolution"))}</label>
      <select class="sel" id="st-res" style="width:100%">
        <option value="opt" ${s.resolution==="opt"?"selected":""}>${esc(t("res.opt"))}</option>
        <option value="1280x720" ${s.resolution==="1280x720"?"selected":""}>1280 × 720</option>
        <option value="1920x1080" ${s.resolution==="1920x1080"?"selected":""}>1920 × 1080</option>
        <option value="2560x1440" ${s.resolution==="2560x1440"?"selected":""}>2560 × 1440</option></select></div>
    <div class="field"><label>${esc(t("set.method"))}</label>
      <select class="sel" id="st-method" style="width:100%">
        <option value="host" ${s.method==="host"?"selected":""}>${esc(t("dev.method.host"))}</option>
        <option value="smb" ${s.method==="smb"?"selected":""}>${esc(t("dev.method.smb"))}</option></select></div>
    <div class="infoBlock">${esc(t("set.info"))}</div>
    <div class="toolbar" style="justify-content:flex-end;margin-top:14px">
      <button class="btn small" data-act="set-reset">${esc(t("set.reset"))}</button>
      <button class="btn primary small" data-act="set-save">${esc(t("set.save"))}</button>
    </div>

    <div class="sep" style="margin:20px 0 0"></div>
    <div class="aboutBlock">
      <div class="logoTile">⚡</div>
      <div class="aboutTitle">${esc(t("about.name"))}</div>
      <div class="aboutVer">${esc(t("about.version", { v: "2.3.0" }))} · Android</div>
      <div class="aboutText">${esc(t("about.desc"))}</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn primary small" data-act="upd-check">${esc(t("upd.check"))}</button>
        <a class="btn small" style="text-decoration:none;display:inline-block" href="https://github.com/pdchristian/WOL/releases" target="_blank" rel="noopener">${esc(t("upd.changelog"))}</a>
      </div>
      <div class="updStatus" id="updStatus">${state.upd}</div>
    </div>`;
}

/* ══════════════════════════ Render: Dashboard (📊, kein Nav-Eintrag) ══════ */
function renderDash() {
  const d = byId(state.ui.dashDeviceId);
  if (!d) { $("#s-dash").innerHTML = `<div class="empty">${esc(t("devices.empty"))}</div>`; return; }
  const on = d.status === "online";
  const pill = on ? "pillOnline" : d.status === "offline" ? "pillOffline" : "pillUnknown";
  let warn = "";
  if (!on) warn = `<div class="warnbox err">${esc(t("dash.unreach", { ip: d.ip || "?" }))}</div>`;
  else if (!d.username) warn = `<div class="warnbox warn">${esc(t("dash.creds"))}</div>`;
  const showMetrics = on && d.username && d.sim.reachable;
  if (showMetrics && !d.metrics) seedMetrics(d);
  const m = showMetrics ? d.metrics : null;
  const svc = d.watch.map(w => ({ w, st: serviceState(d, w) }));
  const models = (d.metrics?.models || []);
  const anyReady = svc.some(s => s.st === "run");
  const batches = currentBatches();
  const sb = selBatchObj();
  const metricCard = (key, val, detail) => `
    <div class="metricCard">
      <div class="mt"><i style="background:var(--gauge-${key})"></i>${esc(t("m." + key))}</div>
      <div class="gauge" data-g="${key}" style="--v:${val ?? 0};--c:var(--gauge-${key})">
        <div class="in"><b data-gv="${key}">${val ?? "–"}%</b></div></div>
      <div class="mdet">${esc(detail)}</div>
      ${key !== "vram" ? `<div data-spark="${key}">${sparkSvg(d.spark[key], `var(--gauge-${key})`)}</div>` : ""}
    </div>`;
  $("#s-dash").innerHTML = `
    <div class="toolbar" style="align-items:center">
      <button class="btn small" data-act="nav-devices">‹ ${esc(t("dash.back"))}</button>
      <span class="spacer"></span>
      <span class="mono" style="font-size:11px">${esc(t("dash.interval"))}</span>
      <select class="sel" data-act="dash-int" style="padding:6px 8px">
        ${[2000,3000,5000,10000].map(v => `<option value="${v}" ${state.ui.dashInterval===v?"selected":""}>${v/1000} s</option>`).join("")}
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div class="pageTitle" style="font-size:19px">${esc(d.name)}</div>
      <span class="pill ${pill}">${esc(statusName(d))}</span>
    </div>
    <div class="mono">${esc([d.ip, d.mac].filter(Boolean).join(" · "))} · ${d.sim.proto >= 3 ? esc(t("hostv", { v: d.sim.proto })) : "—"}</div>
    ${warn}
    ${showMetrics ? `
      <div class="sectionHeading" style="display:flex;justify-content:space-between;align-items:baseline">
        <span>${esc(t("dash.svc"))}</span><span style="font-size:11px;font-weight:400">${esc(t("dash.svc.sub"))}</span></div>
      ${d.watch.length ? `<div class="panel">${svc.map((s, i) => `
        ${i ? '<div class="sep"></div>' : ""}
        <div class="row64" style="min-height:56px">
          <span style="font-size:20px">${s.w.toLowerCase().includes("llama") ? "🦙" : "⚙️"}</span>
          <div class="rowInfo"><div class="rowTitle" style="font-size:13px">${esc(s.w.split(":")[0])}
            ${s.w.toLowerCase().includes("llama") && d.gpuHigh >= 2 ? `<span class="chip probe" style="margin-left:6px;font-size:9px" id="infBadge">${esc(t("dash.inferenz"))}</span>` : ""}</div>
            <span class="mono">${esc(svcLine(d, s.w))}</span>
            ${s.w.toLowerCase().includes("llama") && anyReady && models.length ? `<span class="mono">${esc(t("dash.model", { m: models[0] }))}${models.length > 1 ? ` +${models.length - 1}` : ""}</span>` : ""}
          </div>
        </div>`).join("")}</div>`
      : `<div class="pageSub">${esc(t("dash.svc.none"))}</div>`}
      ${m ? `
      <div class="mono" id="dashUptime" style="margin:10px 0 0">${esc(t("d.uptime", { v: fmtUptime(d.upSeconds) }))}</div>
      <div class="metrics">
        ${metricCard("cpu", m.cpu, t("d.cores", { n: m.cores }))}
        ${metricCard("ram", m.ram, t("d.gb", { used: (m.ram * m.ramTotal / 100).toFixed(1), total: m.ramTotal }))}
        ${metricCard("gpu", m.gpu, t("d.na"))}
        ${metricCard("vram", m.vram, t("d.na"))}
      </div>` : ""}` : ""}
    <div class="sectionHeading" style="display:flex;justify-content:space-between;align-items:baseline">
      <span>${esc(t("batch.title"))}</span>
      <button class="btn small" data-act="batch-new">${esc(t("batch.new"))}</button></div>
    ${batches.length ? `<div class="panel">${batches.map(b => `
      <div class="batchItem ${state.ui.selBatch === b.id ? "sel" : ""}" data-act="batch-sel" data-id="${b.id}">
        ${esc(b.name)}<div class="mono">${esc(b.script)} · ${b.timeout} s</div></div>
      <div class="sep"></div>`).join("")}</div>
      <div class="toolbar" style="margin-top:8px">
        <button class="btn small" data-act="batch-dup">${esc(t("batch.dup"))}</button>
        <button class="btn small danger" data-act="batch-del">${esc(t("batch.del"))}</button>
      </div>`
    : `<div class="pageSub">${esc(t("batch.empty"))}</div>`}
    ${sb ? `
    <div class="panel" style="padding:12px;margin-top:10px">
      <div class="field"><input class="inp" id="b-name" value="${esc(sb.name)}" placeholder="${esc(t("batch.newname"))}"></div>
      <textarea class="code" id="b-script" placeholder="@echo off">${esc(sb.script)}</textarea>
      <div class="toolbar" style="margin:10px 0 0;align-items:center">
        <span class="mono" style="font-size:11px">${esc(t("batch.timeout"))}</span>
        <input class="inp" id="b-timeout" type="number" min="5" max="3600" value="${sb.timeout}" style="width:76px;padding:6px 8px">
        <span class="spacer"></span>
        <button class="btn small" data-act="batch-save" ${state.ui.selBatch===sb.id?"":""} >${esc(t("batch.save"))}</button>
        <button class="btn small primary" data-act="batch-run">${esc(t("batch.run"))}</button>
      </div>
      <div class="togRow" style="padding:10px 0 0"><div style="font-size:12px">${esc(t("batch.allow"))}</div>
        <div class="toggle ${d.allow_batch?"on":""}" data-act="batch-allow"></div></div>
      ${!d.allow_batch ? `<div class="hint" style="font-size:11px;color:var(--unknown);margin-top:6px">${esc(t("batch.disabled"))}</div>` : ""}
    </div>
    <div class="sectionHeading" style="display:flex;justify-content:space-between;align-items:baseline">
      <span>${esc(t("batch.out"))}</span>
      <button class="btn small" data-act="con-clear">${esc(t("batch.clear"))}</button></div>
    <div class="console">${state.con.lines.map(l =>
      `<div class="${/fehler|error/i.test(l) ? "err" : ""}">${esc(l)}</div>`).join("")}
      ${state.con.running ? `<div class="dim">${esc(t("batch.running"))}</div>` : ""}
      ${state.con.exit != null ? `<div class="dim">${esc(t("batch.exit", { c: state.con.exit }))} · ${esc(t("batch.dur", { s: state.con.dur }))}</div>` : ""}</div>` : ""}`;
}

/* ══════════════════════════ Theme / Sprache ═══════════════════════════════ */
function applyTheme() {
  const mode = state.settings.displayMode;
  const eff = mode === "auto"
    ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
  state.theme = eff;
  $("#phone").dataset.theme = eff;
}
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => {
  if (state.settings.displayMode === "auto") applyTheme();
});

function renderAll() {
  applyTheme();
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  renderDevices(); renderManage(); renderSched(); renderLogs(); renderSettings(); renderDash();
}

/* ══════════════════════════ Navigation ════════════════════════════════════ */
function go(screen) {
  state.ui.screen = screen;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $("#s-" + screen).classList.add("active");
  document.querySelectorAll(".nav").forEach(n => n.classList.toggle("active", n.dataset.nav === screen));
  if (screen === "logs") renderLogs();
  if (screen === "dash") renderDash();
  if (screen === "devices") renderDevices();
}

/* ══════════════════════════ Event-Delegation ══════════════════════════════ */
$("#phone").addEventListener("click", ev => {
  const nav = ev.target.closest("[data-nav]");
  if (nav) return go(nav.dataset.nav);
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    /* ── Geräte ── */
    case "view": state.ui.deviceView = state.ui.deviceView === "grid" ? "list" : "grid"; renderDevices(); break;
    case "refresh": refreshStatus(); toast(t("devices.refresh") + " …"); break;
    case "wake": wakeDevice(byId(id)); break;
    case "shutdown": openShutdownConfirm(byId(id)); break;
    case "wake-all": {
      const targets = state.devices.filter(d => d.enabled && d.status !== "online" && d.status !== "waking");
      if (!targets.length) break;
      openConfirm(t("wakeall.title"), t("wakeall.message", { count: targets.length }), () => {
        closeSheet();
        targets.forEach((d, i) => setTimeout(() => wakeDevice(d), i * 400));
        toast(t("wakeall.done", { count: targets.length }));
      });
      break; }
    case "rdp-full": toast(t("remote.demo", { mode: t("button.remote_fullscreen"), name: byId(id).name })); break;
    case "rdp-win": toast(t("remote.demo", { mode: t("button.remote_window"), name: byId(id).name })); break;
    case "open-dash": state.ui.dashDeviceId = id; state.ui.selBatch = null; state.con = { lines:[],running:false,exit:null,dur:null,timer:null }; go("dash"); break;
    case "nav-devices": go("devices"); break;
    case "edit-dev": openDeviceSheet(id); break;
    case "del-dev": deleteDevice(id); break;
    case "dev-save": saveDeviceFromSheet(); break;
    /* ── Long-Press-Menü ── */
    case "m-rdp": toast(t("remote.demo", { mode: el.dataset.mode === "full" ? t("button.remote_fullscreen") : t("button.remote_window"), name: byId(id).name })); closeSheet(); break;
    case "m-dash": closeSheet(); state.ui.dashDeviceId = id; go("dash"); break;
    case "m-wake": closeSheet(); wakeDevice(byId(id)); break;
    case "m-shutdown": closeSheet(); openShutdownConfirm(byId(id)); break;
    case "m-ping": closeSheet(); pingDevice(byId(id)); break;
    case "m-edit": closeSheet(); openDeviceSheet(id); break;
    case "m-del": closeSheet(); deleteDevice(id); break;
    /* ── Verwalten ── */
    case "add-device": openDeviceSheet(null); break;
    case "import": toast(t("imp.done", { count: 0 })); break;
    case "export": {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ devices: state.devices.map(({ metrics, spark, ...d }) => d) }, null, 2)], { type: "application/json" }));
      a.download = "wol_devices.json"; a.click(); URL.revokeObjectURL(a.href);
      toast(t("exp.done")); break; }
    case "scan": startScan(); break;
    case "scan-add": { const r = state.scan.results[+el.dataset.i]; scanAdd(r.host, r.ip, r.mac); break; }
    case "sheet-close": closeSheet(); break;
    case "confirm-yes": { const fn = state.ui.confirmFn; state.ui.confirmFn = null; closeSheet(); fn && fn(); break; }
    case "edit-toggle": {
      const e = state.ui.editing;
      if (el.dataset.key === "sim_host") e.sim.host = !e.sim.host; else e[el.dataset.key] = !e[el.dataset.key];
      el.classList.toggle("on"); break; }
    /* ── Zeitplan ── */
    case "add-sched": openSchedSheet(null); break;
    case "sc-toggle": { const s = state.schedules.find(x => x.id === id); s.enabled = !s.enabled; renderSched(); break; }
    case "sc-edit": openSchedSheet(id); break;
    case "sc-save": saveSchedFromSheet(); break;
    case "sc-del": {
      const s = state.schedules.find(x => x.id === id); const d = byId(s.deviceId);
      openConfirm(t("sched.del.title"), t("sched.del.message", { name: d ? d.name : t("sc.unknown") }), () => {
        state.schedules = state.schedules.filter(x => x.id !== id);
        closeSheet(); renderSched(); toast(t("sched.del.title") + " ✓");
      }, "danger");
      break; }
    case "sc-day": {
      const e = state.ui.editing, day = el.dataset.day;
      e.days = e.days.includes(day) ? e.days.filter(x => x !== day) : [...e.days, day];
      el.classList.toggle("run"); el.classList.toggle("off"); break; }
    /* ── Protokolle ── */
    case "log-export": {
      const csv = "timestamp,device_name,action,status,message\n" + state.logs.map(l =>
        [new Date(l.ts).toISOString(), l.device, l.level, l.level === "error" ? "FAILED" : "OK", (l.msg || "").replaceAll(",", ";")].join(",")).join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
      a.download = "wol_logs.csv"; a.click(); URL.revokeObjectURL(a.href);
      toast(t("logs.exported", { path: "wol_logs.csv" })); break; }
    /* ── Einstellungen ── */
    case "set-toggle": {
      const k = el.dataset.key; state.settings[k] = !state.settings[k]; el.classList.toggle("on"); break; }
    case "set-save": {
      const ip = $("#st-ip").value.trim(), port = +$("#st-port").value;
      if (!ip) { openAlert(t("err.ip_missing"), t("err.ip_msg")); break; }
      if (!RE_IP.test(ip) && !RE_HOST.test(ip)) { openAlert(t("err.ip_title"), t("err.ip_msg")); break; }
      if (!(port >= 1 && port <= 65535)) { openAlert(t("err.port_title"), t("err.port_msg")); break; }
      state.settings.broadcastIp = ip; state.settings.broadcastPort = port;
      state.settings.language = $("#st-lang").value; state.lang = state.settings.language;
      state.settings.displayMode = $("#st-disp").value;
      state.settings.design = $("#st-design").value;
      state.settings.interval = $("#st-int").value;
      state.settings.maxLogs = +$("#st-maxlogs").value || 100;
      state.settings.resolution = $("#st-res").value;
      state.settings.method = $("#st-method").value;
      applyTheme(); renderAll();
      openAlert(t("set.saved.title"), t("set.saved.msg"));
      break; }
    case "set-reset":
      openConfirm(t("set.reset.title"), t("set.reset.msg"), () => {
        Object.assign(state.settings, { broadcastIp: "255.255.255.255", broadcastPort: 9,
          language: "de", displayMode: "auto", design: "modern", autoUpdate: true,
          interval: "168", maxLogs: 100, resolution: "opt", method: "host" });
        state.lang = "de"; closeSheet(); renderAll();
      });
      break;
    /* ── Info / Update ── */
    case "upd-check": {
      state.upd = `<span class="spin"></span> ${esc(t("upd.checking"))}`;
      $("#updStatus").innerHTML = state.upd;
      setTimeout(() => { state.upd = esc(t("upd.ok")); $("#updStatus").textContent = state.upd; }, 1500);
      break; }
    /* ── Dashboard / Batches ── */
    case "batch-new": {
      const b = { id: "b" + Date.now(), devId: state.ui.dashDeviceId, name: t("batch.newname"), script: "@echo off", timeout: 120 };
      state.batches.push(b); state.ui.selBatch = b.id; renderDash(); break; }
    case "batch-sel": state.ui.selBatch = id; state.con = { lines:[],running:false,exit:null,dur:null,timer:null }; renderDash(); break;
    case "batch-dup": { const b = selBatchObj(); if (b) { state.batches.push({ ...b, id: "b" + Date.now(), name: b.name + " (Kopie)" }); renderDash(); } break; }
    case "batch-del": { state.batches = state.batches.filter(b => b.id !== state.ui.selBatch); state.ui.selBatch = null; renderDash(); break; }
    case "batch-save": {
      const b = selBatchObj(); if (!b) break;
      b.name = $("#b-name").value.trim() || b.name; b.script = $("#b-script").value;
      b.timeout = clamp(+$("#b-timeout").value || 120, 5, 3600);
      renderDash(); toast(t("dev.saved")); break; }
    case "batch-run": runBatch(); break;
    case "batch-allow": { const d = byId(state.ui.dashDeviceId); d.allow_batch = !d.allow_batch; renderDash(); break; }
    case "con-clear": state.con = { lines:[],running:false,exit:null,dur:null,timer:null }; renderDash(); break;
  }
});
$("#phone").addEventListener("change", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  switch (el.dataset.act) {
    case "sort": state.ui.sort = el.value; renderDevices(); break;
    case "log-level": state.ui.logLevel = el.value; renderLogs(); break;
    case "dash-int": state.ui.dashInterval = +el.value; restartDashTimer(); renderDash(); break;
  }
});
$("#phone").addEventListener("input", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const keepFocus = (fn) => { const pos = el.selectionStart; fn(); };
  if (act === "search") { state.ui.search = el.value; renderDevices();
    const n = document.querySelector('[data-act="search"]'); if (n) { n.focus(); n.setSelectionRange(el.selectionStart, el.selectionStart); } }
  if (act === "manage-search") { state.ui.manageSearch = el.value; renderManage();
    const n = document.querySelector('[data-act="manage-search"]'); if (n) { n.focus(); n.setSelectionRange(el.selectionStart, el.selectionStart); } }
  if (act === "sched-search") { state.ui.schedSearch = el.value; renderSched();
    const n = document.querySelector('[data-act="sched-search"]'); if (n) { n.focus(); n.setSelectionRange(el.selectionStart, el.selectionStart); } }
  if (act === "log-search") { state.ui.logSearch = el.value; renderLogs();
    const n = document.querySelector('[data-act="log-search"]'); if (n) { n.focus(); n.setSelectionRange(el.selectionStart, el.selectionStart); } }
});
/* Interface-Toggles (Scan) – Klick auf Toggle */
$("#phone").addEventListener("click", ev => {
  const el = ev.target.closest('[data-act="iface-toggle"]');
  if (!el) return;
  const f = state.scan.ifaces[+el.dataset.i]; f.checked = !f.checked; renderManage();
});

/* Long-Press = Rechtsklick-Kontextmenü auf Karten/Zeilen */
const phoneEl = $("#phone");
phoneEl.addEventListener("pointerdown", ev => {
  const host = ev.target.closest("[data-press]");
  if (!host || ev.target.closest("button")) return;
  state.ui.pressTimer = setTimeout(() => openDeviceMenu(host.dataset.id), 550);
});
["pointerup","pointercancel","pointermove"].forEach(evt =>
  phoneEl.addEventListener(evt, () => clearTimeout(state.ui.pressTimer)));

$("#overlay").addEventListener("click", closeSheet);

/* Uhr in der Statusbar */
setInterval(() => { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }, 1000);
