[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Rules: start with a sane default set and keep it strict but non-blocking
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modernize typing)
    "N",   # pep8 naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line length handled by formatter
    "N802",   # allow non-snake-case names (e.g. Qt convention)
    "N803",
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_site_packages = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
